name: G2 writer diagnosis

# Throwaway branch only. Never merge this diagnostic gate.
on:
  push:
    branches: [diag/g2-writer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-writer-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  g2-writer:
    name: G2 writer shard 2/2 (Linux x64, copy ${{ matrix.copy }}/3)
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        copy: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Full Linux shard 2/2 with G2 diagnostics (Docker)
        run: scripts/e2e-linux.sh x64 --shard=2/2
