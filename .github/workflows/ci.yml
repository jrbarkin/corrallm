name: G2 writer diagnosis

# Throwaway branch only. Never merge this diagnostic gate.
on:
  push:
    branches: [diag/g2-writer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2-writer-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  g2-writer:
    name: G2 writer diagnosis (Linux x64, 5 runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Five profiled G2 runs (Docker)
        run: scripts/e2e-linux.sh x64 e2e/load.e2e.ts --grep 'keeps the core.*event loop within budget' --repeat-each=5 --workers=1
