name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No git hooks in CI.
  HUSKY: '0'

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 rather than ubuntu-latest, so runner image upgrades happen deliberately.
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager". Pinned to the v6.1.0 commit:
      # the floating v6 tag still points at a release without pnpm 12 support.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      # Electron >= 42 downloads its binary on first use rather than at install time.
      - run: pnpm exec install-electron

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run package

      # Checks the packaged, fused app on every OS: node-pty loads and spawns in the main process,
      # main's terminal screen (@xterm/headless) works, the bundled Agent SDK runs a query against
      # the self-test's own fake claude (with the node set up above), and launch switches that
      # could hijack the app are refused.
      - name: Allow Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Packaged app checks
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          arch=$(node -p process.arch)
          case "$RUNNER_OS" in
            macOS)
              app="out/corrallm-darwin-$arch/corrallm.app"
              codesign --verify --deep --strict "$app"
              test -x "$app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-$arch/spawn-helper"
              run() { "$app/Contents/MacOS/corrallm" "$@"; }
              ;;
            Windows) run() { "out/corrallm-win32-$arch/corrallm.exe" "$@"; } ;;
            Linux) run() { xvfb-run --auto-servernum "out/corrallm-linux-$arch/corrallm" "$@"; } ;;
          esac

          CORRALLM_NATIVE_SELFTEST=1 run

          for switch in --remote-debugging-port=0 --gpu-launcher=refused --renderer-cmd-prefix=refused; do
            code=0
            CORRALLM_NATIVE_SELFTEST=1 run "$switch" || code=$?
            if [ "$code" -ne 1 ]; then
              echo "::error::packaged app accepted $switch (exit $code, expected 1)"
              exit 1
            fi
          done
