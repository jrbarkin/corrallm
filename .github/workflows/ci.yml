name: CI
# Diagnostic branch only: G2's CPU profile from Linux CI copies (deleted after use).
on:
  push:
    branches: [diag/g2-profile-main]
permissions:
  contents: read
jobs:
  g2:
    name: g2 copy ${{ matrix.copy }}
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Allow Chromium sandbox (Linux)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: G2 with a CPU profile (Linux, Docker)
        run: |
          mkdir -m 777 "$RUNNER_TEMP/diag"
          DIAG_ARTIFACTS="$RUNNER_TEMP/diag" CORRALLM_LOAD_CPU_PROFILE=/artifacts/g2.cpuprofile \
            scripts/e2e-linux.sh x64 e2e/load.e2e.ts -g "event loop within budget"
      - name: Readable profile
        if: always()
        run: sudo chmod -R a+rX "$RUNNER_TEMP/diag"; ls -la "$RUNNER_TEMP/diag"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g2-${{ matrix.copy }}
          path: ${{ runner.temp }}/diag
          retention-days: 3
